<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./signup.css">
    <title>Care-Finder | Sign up to our official care finder website ....</title>
    <link rel="shortcut icon" href="./signup.png" type="image/x-icon">
</head>
<body>
    <div class="mainContainer">
        <div class="leftSide">
            <div class="logo"><h1>Care Finder</h1></div>
            <div class="info">
                <h1>Welcome to Care Finder!</h1>
                <p>Welcome back Finders! Enjoy exciting moments from <br>various extraordinary genres. Enjoy the fun!</p>
            </div>
            <div class="pagebtns">
                <div class="switchbtns">
                    <a href="../Sign Up/signup.html" class="firstlink" onclick="changebg()">Sign Up</a>
                    <a href="../Log in/login.html" class="secondlink" >Log In</a>
                </div>   
            </div>             

            <form method="post">
                <div class="name-input">
                    <div>
                        <label for="Fname">First Name</label>
                        <input type="text" placeholder="First Name" style="margin-top: 3px;" required>
                    </div>
                    <div>
                        <label for="lname">Last Name</label>
                        <input type="text" placeholder="Last Name" style="margin-top: 3px;" required>
                    </div>
                </div>
                <div class="input-box">
                    <label for="email">Email</label>
                    <input type="email" name="email" placeholder="Enter your email" id="email" required>
                </div>
                <div class="input-box">
                    <label for="password">Password</label>
                    <input type="Password" id="initial" required name="password" placeholder="Enter your password" id="password">
                    <!-- <div class="icon"></div> -->
                </div>
                <div class="input-box">
                    <label for="password2">Confirm Password</label>
                    <input type="Password" id="final" required name="password2" placeholder="Enter your password" id="password2">
                    <!-- <div class="icon"></div> -->
                </div>
                <div class="submit">
                    <button type="submit" onclick="confirmPass()">Sign Up</button>
                </div>
                <!-- <p id="middle">Or Sign Up with</p> -->
                 <fieldset>
                    <legend>Or Sign Up with</legend>    
                    <div class="sign-links">
                        <button><p><img src="../images/search.png" alt="">Google</p></button>
                        <button><p><img src="../images/apple-logo.png" alt="">Apple</p></button>
                        <button><p><img src="../images/facebook.png" alt="">Facebook</p></button>
                    </div>
                 </fieldset>
                

            </form>
        </div>
        <div class="rightSide"></div>
    </div>
    <script src="./signup.js"></script>
</body>
</html>
