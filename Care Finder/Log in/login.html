<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./login.css ">
    <script src="login.js"></script>
    <link rel="shortcut icon" href="../Log in/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="mainContainer">
        <div class="leftSide">
            <div class="logo"><h1>Care Finder</h1></div>
            <div class="info">
                <h1>Welcome to Care Finder!</h1>
                <p>Welcome back Finders! Enjoy exciting moments from <br>various extraordinary genres. Enjoy the fun!</p>
            </div>
            <div class="pagebtns">
                <div class="switchbtns">
                    <a href="../Sign Up/signup.html" class="firstlink" onclick="changebg()">Sign Up</a>
                    <a href="../Log in/login.html" class="secondlink" >Log In</a>
                </div>   
            </div>     
           

            <form method="post">
                <div class="input-box">
                    <label for="">Email</label>
                    <input type="email" name="" placeholder="Enter your email" id="" required>
                </div>
                <div class="input-box">
                    <label for="">Password</label>
                    <input type="Password" required name="" placeholder="Enter your password" id="">
                    <!-- <div class="icon"></div> -->
                </div>
                <div class="submit">
                    <button type="submit">Log In</button>
                </div>
                <!-- <p id="middle">Or Sign Up with</p> -->
                 <fieldset>
                    <legend>Or Login with</legend>    
                    <div class="sign-links">
                        <button><p><img src="../images/search.png" alt="">Google</p></button>
                        <button><p><img src="../images/apple-logo.png" alt="">Apple</p></button>
                        <button><p><img src="../images/facebook.png" alt="">Facebook</p></button>
                    </div>
                 </fieldset>
                

            </form>
        </div>
        <div class="rightSide"></div>
    </div>
    
</body>
</html>
